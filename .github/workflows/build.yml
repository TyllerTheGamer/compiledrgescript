name: Build SEA Executable

on:
  push:
    tags:
      - 'v*'

# Required to allow the runner to create a Release and upload files
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output_name: compiler-linux
          - os: windows-latest
            output_name: compiler.exe
          - os: macos-latest
            output_name: compiler-mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Update sea.json output path
        shell: bash
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('sea.json')); c.output='${{ matrix.output_name }}'; fs.writeFileSync('sea.json', JSON.stringify(c, null, 2));"

      - name: Build the executable
        run: node --build-sea sea.json

      - name: Upload to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
